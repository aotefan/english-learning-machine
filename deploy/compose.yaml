name: english-edge
services:
  voice:
    image: ${VOICE_IMAGE:?Set the immutable release image tag}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    environment:
      ADMIN_PUBLIC_ORIGIN: "https://english.example.com"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 640m
    cpus: 1.5
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:18000:18000"
      - "127.0.0.1:18001:18001"
    volumes:
      - /opt/english-edge/secrets:/run/secrets:ro
      - /opt/english-edge/state:/state
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
